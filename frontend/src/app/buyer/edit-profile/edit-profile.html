<div class="dashboard">
    <app-buyer-sidebar></app-buyer-sidebar>
    <div class="content">
        @if (loading) {
        <div class="loading-container">
            <h3>Loading profile...</h3>
        </div>
        }
        @if (!loading && buyer) {
        <div class="page-header">
            <div>
                <h1>Edit Profile</h1>
                <p>Update your personal information</p>
            </div>
        </div>
        <div class="form-card">
            <form (ngSubmit)="updateProfile()" #profileForm="ngForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>
                            Full Name
                        </label>
                        <input type="text" name="name" class="form-control" [(ngModel)]="buyer.name" required>
                    </div>
                    <div class="form-group">
                        <label>
                            Email
                        </label>
                        <input type="email" name="email" class="form-control" [(ngModel)]="buyer.email" required>
                    </div>
                    <div class="form-group">
                        <label>
                            Mobile
                        </label>
                        <input type="text" name="mobile" class="form-control" [(ngModel)]="buyer.mobile" required>
                    </div>
                    <div class="form-group">
                        <label>
                            Address
                        </label>
                        <input type="text" name="address" class="form-control" [(ngModel)]="buyer.address" required>
                    </div>
                    <div class="form-group">
                        <label>
                            City
                        </label>
                        <input type="text" name="city" class="form-control" [(ngModel)]="buyer.city" required>
                    </div>
                    <div class="form-group">
                        <label>
                            State
                        </label>
                        <input type="text" name="state" class="form-control" [(ngModel)]="buyer.state" required>
                    </div>
                    <div class="form-group">
                        <label>
                            Pincode
                        </label>
                        <input type="text" name="pincode" class="form-control" [(ngModel)]="buyer.pincode" required>
                    </div>
                </div>
                <div class="button-section">
                    <button type="button" class="btn btn-secondary" (click)="cancel()">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-success" [disabled]="saving || profileForm.invalid">
                        @if (saving) {
                        Saving...
                        } @else {
                        <i class="bi bi-check-circle"></i>
                        Save Changes
                        }
                    </button>
                </div>
            </form>
        </div>
        }
        @if (!loading && !buyer) {
        <div class="loading-container">
            <h3>Buyer profile not found.</h3>
        </div>
        }
    </div>
</div>
