<div class="sidebar">
    <div class="logo">
        <img src="https://cdn-icons-png.flaticon.com/512/2909/2909767.png">
        <h2>AgriMarket</h2>
    </div>
    <ul>
        <li routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
            <a routerLink="/farmer/dashboard">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
        </li>
        <li routerLinkActive="active">
            <a routerLink="/farmer/products">
                <i class="bi bi-box-seam"></i>
                <span>Products</span>
            </a>
        </li>
        <li routerLinkActive="active">
            <a routerLink="/farmer/add-product">
                <i class="bi bi-plus-circle"></i>
                <span>Add Product</span>
            </a>
        </li>
        <li routerLinkActive="active">
            <a routerLink="/farmer/orders">
                <i class="bi bi-bag"></i>
                <span>Orders</span>
            </a>
        </li>
        <li routerLinkActive="active">
            <a routerLink="/farmer/earnings">
                <i class="bi bi-cash-stack"></i>
                <span>Earnings</span>
            </a>
        </li>
        <li routerLinkActive="active">
            <a routerLink="/farmer/profile">
                <i class="bi bi-person"></i>
                <span>Profile</span>
            </a>
        </li>
        <li>
            <a routerLink="/login">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
        </li>
    </ul>
</div>
