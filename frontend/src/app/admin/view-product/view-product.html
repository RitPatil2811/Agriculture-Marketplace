<div class="dashboard">
    <app-admin-sidebar></app-admin-sidebar>
    <div class="content">
        <!-- PAGE HEADER -->
        <div class="page-header">
            <h1>Product Details</h1>
            <p>
                Complete information about the selected product.
            </p>
        </div>
        <!-- LOADING -->
        @if (loading) {
        <div class="message-card">
            <h3>Loading product...</h3>
        </div>
        }
        <!-- ERROR -->
        @if (!loading && errorMessage) {
        <div class="message-card error">
            <h3>{{ errorMessage }}</h3>
            <a routerLink="/admin/products" class="btn btn-secondary">
                Back to Products
            </a>
        </div>
        }
        <!-- PRODUCT DETAILS -->
        @if (!loading && product) {
        <div class="product-card">
            <!-- PRODUCT IMAGE -->
            <div class="product-image">
                <img [src]="'http://localhost:8080' + product.image" [alt]="product.name">
            </div>
            <!-- DETAILS -->
            <div class="details-grid">
                <!-- PRODUCT NAME -->
                <div class="form-group">
                    <label>Product Name</label>
                    <input class="form-control" [value]="product.name" readonly>
                </div>
                <!-- CATEGORY -->
                <div class="form-group">
                    <label>Category</label>
                    <input class="form-control" [value]="product.category" readonly>
                </div>
                <!-- FARMER ID -->
                <div class="form-group">
                    <label>Farmer ID</label>
                    <input class="form-control" [value]="product.farmerId" readonly>
                </div>
                <!-- PRICE -->
                <div class="form-group">
                    <label>Price</label>
                    <input class="form-control" [value]="'₹' + product.price + ' / ' + product.unit" readonly>
                </div>
                <!-- QUANTITY -->
                <div class="form-group">
                    <label>Available Quantity</label>
                    <input class="form-control" [value]="product.quantity + ' ' + product.unit" readonly>
                </div>
                <!-- PRODUCT ID -->
                <div class="form-group">
                    <label>Product ID</label>
                    <input class="form-control" [value]="product.id" readonly>
                </div>
                <!-- DESCRIPTION -->
                <div class="form-group full-width">
                    <label>Description</label>
                    <textarea class="form-control" rows="5" readonly>{{ product.description }}</textarea>
                </div>
            </div>
            <!-- BUTTONS -->
            <div class="buttons">
                <button class="btn btn-success" (click)="approveProduct()">
                    Approve
                </button>
                <!-- Delete -->
                <button class="btn btn-danger btn-sm" (click)="deleteProduct()">
                    Delete
                </button>
                <a routerLink="/admin/manage-product" class="btn btn-secondary">
                    Back
                </a>
            </div>
        </div>
        }
    </div>
</div>
