<div class="dashboard">
    <app-admin-sidebar></app-admin-sidebar>
    <div class="content">
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1>Farmer Details</h1>
                <p>
                    Complete information about the farmer.
                </p>
            </div>
        </div>
        <!-- Loading -->
        @if (loading) {
            <div class="details-card">
                <h3>Loading farmer details...</h3>
            </div>
        }
        <!-- Farmer Details -->
        @if (!loading && farmer) {
            <div class="details-card">
                <!-- Profile Image -->
                <div class="profile-section">
                    <img
                        src="images/profile.jpg"
                        class="profile-img"
                        alt="Farmer">
                </div>
                <div class="details-grid">
                    <!-- Farmer Name -->
                    <div class="form-group">
                        <label>Farmer Name</label>
                        <input
                            type="text"
                            [value]="farmer.name"
                            readonly>
                    </div>
                    <!-- Email -->
                    <div class="form-group">
                        <label>Email</label>
                        <input
                            type="text"
                            [value]="farmer.email"
                            readonly>
                    </div>
                    <!-- Mobile -->
                    <div class="form-group">
                        <label>Mobile</label>
                        <input
                            type="text"
                            [value]="farmer.mobile"
                            readonly>
                    </div>
                    <!-- Farm Name -->
                    <div class="form-group">
                        <label>Farm Name</label>
                        <input
                            type="text"
                            [value]="farmer.farmName || '-'"
                            readonly>
                    </div>
                    <!-- Experience -->
                    <div class="form-group">
                        <label>Experience</label>
                        <input
                            type="text"
                            [value]="farmer.experience != null ? farmer.experience + ' years' : '-'"
                            readonly>
                    </div>
                    <!-- Joined -->
                    <div class="form-group">
                        <label>Joined On</label>
                        <input
                            type="text"
                            [value]="farmer.joined || '-'"
                            readonly>
                    </div>
                    <!-- Status -->
                    <div class="form-group">
                        <label>Status</label>
                        <input
                            type="text"
                            [value]="farmer.status || 'Pending'"
                            readonly>
                    </div>
                    <!-- Address -->
                    <div class="form-group full-width">
                        <label>Address</label>
                        <textarea
                            readonly>{{ farmer.address || '-' }}</textarea>
                    </div>
                </div>
                <!-- Buttons -->
                <div class="actions">
                    @if (farmer.status !== 'Active') {
                        <button
                            class="btn btn-success"
                            (click)="approveFarmer()">
                            Approve
                        </button>
                    }
                    @if (farmer.status !== 'Blocked') {
                        <button
                            class="btn btn-danger"
                            (click)="blockFarmer()">
                            Block
                        </button>
                    }
                    <button
                        class="btn btn-secondary"
                        (click)="goBack()">
                        Back
                    </button>
                </div>
            </div>
        }
        <!-- Farmer Not Found -->
        @if (!loading && !farmer) {
            <div class="details-card">
                <h3>Farmer not found.</h3>
                <button
                    class="btn btn-secondary"
                    (click)="goBack()">
                    Back
                </button>
            </div>
        }
    </div>
</div>
